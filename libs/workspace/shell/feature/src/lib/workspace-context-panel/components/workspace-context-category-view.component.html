@if (categorySections().length > 0) {
    <div class="category-browser">
        @if (statusText()) {
            <div class="context-inline-status">
                {{ statusText() }}
            </div>
        }
        @for (section of categorySections(); track section.key) {
            <section
                class="category-section"
                [class.category-section--all]="section.key === 'all'"
            >
                @if (section.label) {
                    <h3 class="category-section__heading">
                        {{ section.label }}
                    </h3>
                }
                <div class="category-section__items">
                    @for (item of section.items; track $index) {
                        <button
                            type="button"
                            class="nav-item category-item"
                            [attr.data-category-id]="
                                $any(item).category_id ??
                                $any(item).xtream_id ??
                                item.id
                            "
                            [class.selected]="isSelected(item)"
                            [class.category-item--selected]="isSelected(item)"
                            [class.category-item--disabled]="
                                !interactionEnabled()
                            "
                            [attr.aria-current]="
                                isSelected(item) ? 'true' : null
                            "
                            [attr.aria-disabled]="!interactionEnabled()"
                            [disabled]="!interactionEnabled()"
                            (click)="onCategoryClick(item)"
                        >
                            <span class="nav-item-label">
                                {{
                                    item.category_name ||
                                        $any(item).name ||
                                        'No category name'
                                }}
                            </span>
                            @if (showCounts()) {
                                @if (countDisplayMode() === 'loading') {
                                    <div
                                        class="item-count item-count--loading"
                                        aria-hidden="true"
                                    ></div>
                                } @else if (hasItemCount(item)) {
                                    <div class="item-count app-count-badge">
                                        {{ getItemCount(item) }}
                                    </div>
                                }
                            } @else if ($any(item).count !== undefined) {
                                <div class="item-count app-count-badge">
                                    {{ $any(item).count }}
                                </div>
                            }
                        </button>
                    }
                </div>
            </section>
        }
    </div>
} @else {
    <div class="category-empty-state">
        <app-workspace-context-error-view
            [title]="'No categories available'"
            [showIllustration]="false"
            [showActionButtons]="false"
            [viewType]="'EMPTY_CATEGORY'"
        />
    </div>
}
