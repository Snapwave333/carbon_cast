<nav
    class="rail-links"
    [class.has-labels]="showLabels() && !expanded()"
    [class.is-expanded]="expanded()"
>
    @for (link of links(); track link.path.join('/')) {
        <a
            class="portal-rail-link nav-item"
            [class.is-labelled]="showLabels() && !expanded()"
            [class.is-expanded]="expanded()"
            [routerLink]="link.path"
            [routerLinkActive]="activeClass()"
            [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
            [matTooltip]="link.tooltip"
            [matTooltipPosition]="tooltipPosition()"
            [matTooltipDisabled]="labelled()"
            [attr.aria-label]="link.tooltip"
            [attr.aria-current]="isActive(link) ? 'page' : null"
            [class.active]="activeClass() === 'active' && isActive(link)"
            [class.is-active]="
                activeClass() === 'is-active' && isActive(link)
            "
        >
            <mat-icon [svgIcon]="resolveIcon(link)"></mat-icon>
            @if (labelled()) {
                <span class="portal-rail-link__label" aria-hidden="true">{{
                    link.tooltip
                }}</span>
            }
        </a>
    }
</nav>
