<nav class="app-nav-dock" aria-label="Primary navigation">
    <div class="nav-primary-row">
        <a
            class="brand app-hover-rule"
            [routerLink]="brandLink()"
            [matTooltip]="brandTooltipKey() | translate"
            [matTooltipPosition]="tooltipPosition"
            [attr.aria-label]="brandAriaLabelKey() | translate"
        >
            <img
                src="./assets/icons/app-icon.svg"
                [attr.alt]="'WORKSPACE.SHELL.BRAND_ALT' | translate"
            />
            <span class="brand-wordmark" aria-hidden="true">CarbonCast</span>
        </a>

        <div class="nav-destinations-scroll">
            @if (primaryContextLinks().length > 0) {
                <div [class]="'nav-context-cluster ' + railProviderClass()">
                    <app-workspace-shell-rail-links
                        activeClass="is-active"
                        showLabels
                        [tooltipPosition]="tooltipPosition"
                        [selectedSection]="selectedSection()"
                        [links]="primaryContextLinks()"
                    />

                    @if (secondaryContextLinks().length > 0) {
                        <div
                            class="nav-context-divider"
                            aria-hidden="true"
                        ></div>
                        <app-workspace-shell-rail-links
                            activeClass="is-active"
                            showLabels
                            [tooltipPosition]="tooltipPosition"
                            [selectedSection]="selectedSection()"
                            [links]="secondaryContextLinks()"
                        />
                    }
                </div>
                <div class="nav-scope-divider" aria-hidden="true"></div>
            }

            <app-workspace-shell-rail-links
                showLabels
                [links]="workspaceLinks()"
                [tooltipPosition]="tooltipPosition"
            />
        </div>

        @if (canNavigateChannels()) {
            <div
                class="nav-channel-actions"
                role="group"
                [attr.aria-label]="'PLAYBACK_BAR.TITLE' | translate"
            >
                <button
                    type="button"
                    mat-icon-button
                    class="nav-channel-button"
                    data-test-id="workspace-channel-up"
                    (click)="changeChannel('up')"
                    [matTooltip]="'CHANNELS.CHANNEL_UP' | translate"
                    [matTooltipPosition]="tooltipPosition"
                    [attr.aria-label]="'CHANNELS.CHANNEL_UP' | translate"
                >
                    <mat-icon svgIcon="arrow_upward"></mat-icon>
                </button>
                <button
                    type="button"
                    mat-icon-button
                    class="nav-channel-button"
                    data-test-id="workspace-channel-down"
                    (click)="changeChannel('down')"
                    [matTooltip]="'CHANNELS.CHANNEL_DOWN' | translate"
                    [matTooltipPosition]="tooltipPosition"
                    [attr.aria-label]="'CHANNELS.CHANNEL_DOWN' | translate"
                >
                    <mat-icon svgIcon="arrow_downward"></mat-icon>
                </button>
            </div>
        }

        <a
            class="nav-settings nav-item app-hover-rule"
            routerLink="/workspace/settings"
            [class.is-active]="isSettingsRoute()"
            [matTooltip]="'WORKSPACE.SHELL.RAIL_SETTINGS' | translate"
            [matTooltipPosition]="tooltipPosition"
            [matTooltipDisabled]="true"
            [attr.aria-label]="'WORKSPACE.SHELL.OPEN_SETTINGS' | translate"
        >
            <mat-icon svgIcon="settings"></mat-icon>
            <span class="nav-link-label" aria-hidden="true">{{
                'WORKSPACE.SHELL.RAIL_SETTINGS' | translate
            }}</span>
        </a>
    </div>
</nav>
