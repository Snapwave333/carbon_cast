<header class="all-channels-header">
    <div class="all-channels-header__top">
        <h2>{{ 'CHANNELS.ALL_CHANNELS' | translate }}</h2>
        <button
            type="button"
            mat-icon-button
            class="all-channels-sort-button"
            [matMenuTriggerFor]="channelSortMenu"
            [matTooltip]="
                'CHANNELS.SORT_TOOLTIP'
                    | translate: { mode: allChannelsSortLabel() | translate }
            "
            [attr.aria-label]="'CHANNELS.SORT_CHANNELS' | translate"
        >
            <mat-icon svgIcon="sort_by_alpha"></mat-icon>
        </button>
        <button
            type="button"
            mat-icon-button
            class="all-channels-sidebar-toggle"
            [attr.aria-label]="'LAYOUT.HIDE_CHANNELS_LIST' | translate"
            [matTooltip]="'LAYOUT.TOGGLE_SIDEBAR_TOOLTIP' | translate"
            (click)="sidebarToggleRequested.emit()"
        >
            <mat-icon svgIcon="chevron_left"></mat-icon>
        </button>
    </div>

    <mat-menu #channelSortMenu="matMenu">
        <button mat-menu-item (click)="setAllChannelsSortMode('server')">
            <mat-icon svgIcon="drag_indicator"></mat-icon>
            <span>{{ 'CHANNELS.SORT_PLAYLIST_ORDER' | translate }}</span>
            @if (allChannelsSortMode() === 'server') {
                <mat-icon svgIcon="check"></mat-icon>
            }
        </button>
        <button mat-menu-item (click)="setAllChannelsSortMode('name-asc')">
            <mat-icon svgIcon="sort_by_alpha"></mat-icon>
            <span>{{ 'CHANNELS.SORT_NAME_ASC' | translate }}</span>
            @if (allChannelsSortMode() === 'name-asc') {
                <mat-icon svgIcon="check"></mat-icon>
            }
        </button>
        <button mat-menu-item (click)="setAllChannelsSortMode('name-desc')">
            <mat-icon svgIcon="sort_by_alpha"></mat-icon>
            <span>{{ 'CHANNELS.SORT_NAME_DESC' | translate }}</span>
            @if (allChannelsSortMode() === 'name-desc') {
                <mat-icon svgIcon="check"></mat-icon>
            }
        </button>
    </mat-menu>
</header>
<div class="all-channels-divider"></div>

<div id="all-channels" class="channel-list">
    @if (filteredChannels().length === 0 && searchTerm()) {
        <div class="no-results">
            <mat-icon class="no-results-icon" svgIcon="search_off"></mat-icon>
            <div class="no-results-title">
                {{ 'CHANNELS.NO_SEARCH_RESULTS' | translate }}
            </div>
            <div class="no-results-hint">
                {{ 'CHANNELS.TRY_DIFFERENT_SEARCH' | translate }}
            </div>
        </div>
    } @else {
        <cdk-virtual-scroll-viewport
            [itemSize]="itemSize()"
            class="scroll-viewport app-scrollbar"
            role="listbox"
            tabindex="0"
            [attr.aria-label]="'CHANNELS.ALL_CHANNELS' | translate"
            [attr.aria-activedescendant]="activeDescendantId()"
            (keydown)="onListKeydown($event)"
        >
            <app-channel-list-item
                *cdkVirtualFor="
                    let channel of filteredChannels();
                    index as i;
                    trackBy: trackByFn
                "
                [name]="
                    i +
                    1 +
                    '. ' +
                    (channel?.name ||
                        ('CHANNELS.UNNAMED_CHANNEL' | translate))
                "
                [logo]="getLogoForChannel(channel)"
                [showEpg]="shouldShowEpg()"
                [showDetailsContextMenu]="true"
                [isRadio]="channel?.radio === 'true'"
                [epgProgram]="
                    epgMetadataMap().get(getChannelEpgKey(channel))?.epgProgram
                "
                [progressPercentage]="
                    epgMetadataMap().get(getChannelEpgKey(channel))
                        ?.progressPercentage ?? 0
                "
                (clicked)="onChannelClick(channel, i)"
                (activated)="onChannelActivate(channel)"
                (contextMenuRequested)="
                    channelContextMenu.open(channel, $event)
                "
                [selected]="activeChannelUrl() === channel?.url"
                [rowId]="'channel-option-' + i"
                [keyboardFocused]="focusedIndex() === i"
                [showFavoriteButton]="true"
                [isFavorite]="favoriteIds().has(channel?.url ?? '')"
                (favoriteToggled)="onFavoriteToggle(channel, $event)"
            />
        </cdk-virtual-scroll-viewport>
    }
</div>

<app-channel-context-menu #channelContextMenu />
