<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">CarbonCast IPTV</title>
  <desc id="description">A premium CarbonCast IPTV banner with the CarbonCast play mark, live-broadcast controls, and feature icons.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11161b"/><stop offset=".52" stop-color="#07090c"/><stop offset="1" stop-color="#0e1319"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3b47"/><stop offset="1" stop-color="#c20916"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af0ff"/><stop offset="1" stop-color="#00a8d0"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18232d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <pattern id="carbon" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#07090c"/><path d="M0 3H18M0 12H18" stroke="#fff" stroke-opacity=".025" stroke-width="3"/><path d="M4 0V18M13 0V18" stroke="#00d8ff" stroke-opacity=".018" stroke-width="2"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".48"/></filter>
    <clipPath id="frame"><rect x="16" y="16" width="1568" height="588" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="16" y="16" width="1568" height="588" rx="36" fill="url(#surface)"/>
    <rect x="16" y="16" width="1568" height="588" fill="url(#carbon)"/>
    <path d="M0 520C252 384 408 655 738 490S1230 335 1620 470M0 542C240 408 421 671 752 509S1222 355 1620 488" fill="none" stroke="#00d8ff" stroke-opacity=".13" stroke-width="2"/>
    <path d="M0 542C240 408 421 671 752 509S1222 355 1620 488" fill="none" stroke="#e10d1a" stroke-opacity=".15" stroke-width="2"/>
    <path d="M1340 0H1600V215L1360 430 1275 345Z" fill="#e10d1a" fill-opacity=".08"/><path d="M1210 0H1239L1570 330H1541Z" fill="#00d8ff" fill-opacity=".12"/>
    <!-- Official CarbonCast app-mark geometry, enlarged for GitHub presentation. -->
    <g transform="translate(91 112) scale(.43)" filter="url(#shadow)">
      <rect x="20" y="20" width="472" height="472" rx="92" fill="#07090c" stroke="#26313c" stroke-width="6"/>
      <path d="M82 142 L142 82 H370 L430 142 V342 L370 402 H142 L82 342 Z" fill="none" stroke="url(#red)" stroke-width="36" stroke-linejoin="round"/>
      <path d="M210 174 L344 256 L210 338 Z" fill="#f4f7fa"/><path d="M364 166 C394 182 412 209 416 240" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linecap="round"/><path d="M380 116 C435 146 466 194 470 250" fill="none" stroke="url(#cyan)" stroke-width="18" stroke-linecap="round" opacity=".78"/><circle cx="140" cy="348" r="18" fill="#ff6a00"/>
    </g>
    <g transform="translate(338 119)">
      <text x="0" y="78" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" letter-spacing="2">CARBON<tspan fill="#e10d1a">CAST</tspan></text>
      <g transform="translate(3 111)"><line x1="0" y1="0" x2="150" y2="0" stroke="#00d8ff" stroke-width="7"/><text x="174" y="19" fill="#00d8ff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="18">IPTV</text><line x1="350" y1="0" x2="500" y2="0" stroke="#00d8ff" stroke-width="7"/></g>
      <text x="3" y="192" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7">STREAM MORE. <tspan fill="#e10d1a">LIVE</tspan> BETTER.</text>
      <g transform="translate(3 238)"><rect width="276" height="47" rx="23.5" fill="#e10d1a"/><circle cx="25" cy="23.5" r="7" fill="#f4f7fa" filter="url(#glow)"/><text x="46" y="30" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2">OPEN-SOURCE IPTV</text><text x="303" y="30" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">DESKTOP  •  WEB  •  SELF-HOSTED</text></g>
    </g>
    <!-- Live-control visual uses the product's red, cyan, and lifted-carbon surfaces. -->
    <g transform="translate(1066 97)" filter="url(#shadow)">
      <rect width="390" height="286" rx="26" fill="url(#screen)" stroke="#26313c" stroke-width="2"/><path d="M0 43H390" stroke="#26313c" stroke-width="2"/><circle cx="31" cy="22" r="7" fill="#e10d1a"/><text x="50" y="28" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2">LIVE CONTROL</text><text x="316" y="28" fill="#00d8ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">4K READY</text>
      <rect x="22" y="65" width="346" height="118" rx="15" fill="#07090c" stroke="#26313c"/><g transform="translate(48 91)"><circle cx="30" cy="31" r="30" fill="#e10d1a" fill-opacity=".15"/><path d="M20 13 L47 31 L20 49Z" fill="#f4f7fa"/><path d="M52 18C64 25 68 35 69 43" fill="none" stroke="#00d8ff" stroke-width="5" stroke-linecap="round"/></g><path d="M148 142C161 122 173 159 187 132S211 115 226 140 247 154 264 127 286 112 301 136 324 157 340 124" fill="none" stroke="#00d8ff" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="212" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Your stream. Your way.</text><rect x="30" y="232" width="104" height="28" rx="14" fill="#e10d1a"/><text x="50" y="251" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PLAY NOW</text><rect x="148" y="232" width="112" height="28" rx="14" fill="#171e25" stroke="#26313c"/><text x="169" y="251" fill="#00d8ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DISCOVER</text>
    </g>
    <!-- Feature icons from the CarbonCast icon system: fast, live, premium, reliable. -->
    <g transform="translate(337 450)">
      <g><path d="M28 0 5 36H25L17 67 52 25H31Z" fill="url(#red)"/><text x="70" y="29" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">FAST</text><text x="70" y="51" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">HIGH PERFORMANCE</text></g>
      <g transform="translate(266)"><circle cx="30" cy="34" r="8" fill="#e10d1a"/><path d="M14 18C5 26 5 42 14 50M46 18C55 26 55 42 46 50M4 8C-10 22-10 46 4 60M56 8C70 22 70 46 56 60" fill="none" stroke="#e10d1a" stroke-width="5" stroke-linecap="round"/><text x="78" y="29" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">LIVE</text><text x="78" y="51" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">ALWAYS CONNECTED</text></g>
      <g transform="translate(555)"><path d="M31 3 59 14 49 60H13L3 14Z" fill="none" stroke="#e10d1a" stroke-width="5" stroke-linejoin="round"/><path d="M3 14H59M17 14 31 60 45 14M31 3 17 14M31 3 45 14" fill="none" stroke="#e10d1a" stroke-width="4" stroke-linejoin="round"/><text x="78" y="29" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">PREMIUM</text><text x="78" y="51" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">POLISHED EVERYWHERE</text></g>
      <g transform="translate(895)"><path d="M31 2 58 13V32C58 49 47 60 31 67 15 60 4 49 4 32V13Z" fill="none" stroke="#e10d1a" stroke-width="5" stroke-linejoin="round"/><path d="m18 33 9 9 18-20" fill="none" stroke="#e10d1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="29" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">RELIABLE</text><text x="78" y="51" fill="#8c98a5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">BUILT TO KEEP PLAYING</text></g>
    </g>
  </g>
  <rect x="16" y="16" width="1568" height="588" rx="36" fill="none" stroke="#26313c" stroke-width="3"/>
</svg>
