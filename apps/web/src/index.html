<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>CarbonCast IPTV</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://www.youtube-nocookie.com; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: file: data: blob:; font-src 'self' data:; media-src 'self' http: https: file: data: blob:; connect-src 'self' http: https: ws: wss: blob: data:; worker-src 'self' blob:"
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="CarbonCast IPTV" />
        <meta
            property="og:url"
            content="https://snapwave333.github.io/carbon_cast/"
        />
        <meta
            property="og:image"
            content="https://raw.githubusercontent.com/Snapwave333/carbon_cast/main/apps/web/src/assets/icons/icon-1024.png"
        />
        <meta
            property="og:description"
            content="CarbonCast IPTV is a video player application that provides support for the playback of IPTV playlists (m3u, m3u8)"
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
        <script src="assets/app-config.js" defer></script>
        <style>
            /* Inline splash — paints immediately while the JS bundle and the
               styles.css (~300KB) are still downloading and Angular is
               bootstrapping. main.ts adds .is-ready to fade it out, then
               removes it. No assets and no extra HTTP: the mark is inline SVG
               and the carbon weave is a gradient, so this is the first paint.
               Colours match the app shell (--app-shell-bg) so the handoff to
               the real UI has no visible jump. */
            #initial-splash {
                position: fixed;
                inset: 0;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 26px;
                background:
                    radial-gradient(
                        circle at 50% 42%,
                        rgba(255, 59, 59, 0.16),
                        transparent 58%
                    ),
                    repeating-linear-gradient(
                        45deg,
                        rgba(255, 255, 255, 0.022) 0 2px,
                        transparent 2px 4px
                    ),
                    repeating-linear-gradient(
                        -45deg,
                        rgba(0, 0, 0, 0.28) 0 2px,
                        transparent 2px 4px
                    ),
                    #08090c;
                color: #d8dce8;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    'Helvetica Neue', Arial, sans-serif;
                opacity: 1;
                transition:
                    opacity 420ms cubic-bezier(0.4, 0, 1, 1),
                    transform 420ms cubic-bezier(0.4, 0, 1, 1);
            }

            /* Hand-off state set by main.ts once Angular has painted. */
            #initial-splash.is-ready {
                opacity: 0;
                transform: scale(1.04);
                pointer-events: none;
            }

            #initial-splash .splash-mark {
                position: relative;
                width: 108px;
                height: 108px;
                animation: splash-bloom 2.6s ease-in-out 0.9s infinite;
            }

            /* Glow sitting behind the monogram, so the red reads as emitted
               light rather than a flat fill. */
            #initial-splash .splash-mark::before {
                content: '';
                position: absolute;
                inset: -34%;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(255, 59, 59, 0.32),
                    transparent 62%
                );
                filter: blur(6px);
            }

            #initial-splash svg {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: visible;
            }

            /* The two arcs draw themselves on, then hold. */
            #initial-splash svg path {
                stroke-dasharray: 340;
                stroke-dashoffset: 340;
                animation: splash-draw 1s cubic-bezier(0.2, 0, 0, 1) forwards;
                filter: drop-shadow(0 0 10px rgba(255, 59, 59, 0.45));
            }
            #initial-splash svg path:nth-child(2) {
                animation-delay: 0.14s;
            }

            #initial-splash .splash-word {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                animation: splash-rise 700ms cubic-bezier(0.2, 0, 0, 1) 0.42s
                    both;
            }
            #initial-splash .splash-title {
                font-size: 21px;
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }
            #initial-splash .splash-sub {
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.34em;
                text-transform: uppercase;
                color: #6b7494;
            }

            /* Indeterminate sweep — reads as "loading" without the generic
               spinner, and matches the app's accent. */
            #initial-splash .splash-progress {
                position: relative;
                width: 168px;
                height: 2px;
                border-radius: 999px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.08);
                animation: splash-rise 700ms cubic-bezier(0.2, 0, 0, 1) 0.58s
                    both;
            }
            #initial-splash .splash-progress::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: linear-gradient(
                    90deg,
                    transparent,
                    #ff3b3b,
                    rgba(255, 140, 26, 0.9),
                    transparent
                );
                transform: translateX(-100%);
                animation: splash-sweep 1.35s ease-in-out 0.7s infinite;
            }

            @keyframes splash-draw {
                to {
                    stroke-dashoffset: 0;
                }
            }
            @keyframes splash-rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes splash-bloom {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.035);
                }
            }
            @keyframes splash-sweep {
                to {
                    transform: translateX(100%);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                #initial-splash,
                #initial-splash * {
                    animation: none !important;
                    transition-duration: 0.01ms !important;
                }
                #initial-splash svg path {
                    stroke-dashoffset: 0;
                }
                #initial-splash .splash-word,
                #initial-splash .splash-progress {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body class="mat-app-background">
        <div
            id="initial-splash"
            role="status"
            aria-label="Loading CarbonCast IPTV"
        >
            <div class="splash-mark" aria-hidden="true">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M131.7 222.1 A64 64 0 1 1 131.7 289.9"
                        fill="none"
                        stroke="#ff3b3b"
                        stroke-width="34"
                        stroke-linecap="round"
                    />
                    <path
                        d="M380.3 222.1 A64 64 0 1 0 380.3 289.9"
                        fill="none"
                        stroke="#ff3b3b"
                        stroke-width="34"
                        stroke-linecap="round"
                    />
                </svg>
            </div>
            <div class="splash-word" aria-hidden="true">
                <span class="splash-title">CarbonCast</span>
                <span class="splash-sub">IPTV</span>
            </div>
            <div class="splash-progress" aria-hidden="true"></div>
        </div>
        <app-root></app-root>
    </body>
</html>
