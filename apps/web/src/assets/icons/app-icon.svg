<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <!-- Carbon-fibre twill: a 2x2 basketweave of tows with a directional
         sheen, echoing the app's carbon UI. Eight cells across the mark, with
         enough tow-to-ground contrast that the weave still reads at 128px —
         a finer, lower-contrast version washed out to flat black there. -->
    <pattern id="carbon-weave" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#04060A"/>
      <rect x="1" y="1" width="30" height="30" rx="3" fill="#242E3E"/>
      <rect x="33" y="33" width="30" height="30" rx="3" fill="#242E3E"/>
      <rect x="1" y="1" width="30" height="3" fill="#46536B"/>
      <rect x="33" y="33" width="30" height="3" fill="#46536B"/>
      <rect x="33" y="1" width="3" height="30" fill="#46536B" opacity=".55"/>
      <rect x="1" y="33" width="3" height="30" fill="#46536B" opacity=".55"/>
    </pattern>
  </defs>

  <circle cx="256" cy="256" r="238" fill="url(#carbon-weave)"/>
  <!-- Rim: without it the near-black field merges into a dark wallpaper. -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="#2C3342" stroke-width="6"/>

  <!-- CarbonCast monogram: two C's in mirror symmetry about x=256, set back
       to back. Facing them inward instead puts both openings on the centre
       line, and the resulting cleft between two lobes reads as anatomy. -->
  <path d="M131.7 222.1 A64 64 0 1 1 131.7 289.9" fill="none" stroke="#E10D1A" stroke-width="34" stroke-linecap="round"/>
  <path d="M380.3 222.1 A64 64 0 1 0 380.3 289.9" fill="none" stroke="#E10D1A" stroke-width="34" stroke-linecap="round"/>
</svg>
