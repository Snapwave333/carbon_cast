<section
    class="settings-group"
    [class.settings-group--active]="activeSection() === 'backup'"
    id="backup"
>
    <header class="settings-group__header">
        <div class="settings-group__header-icon">
            <mat-icon svgIcon="backup"></mat-icon>
        </div>
        <div class="settings-group__header-text">
            <h3>{{ 'SETTINGS.BACKUP' | translate }}</h3>
            <p>{{ 'SETTINGS.BACKUP_DESCRIPTION' | translate }}</p>
        </div>
    </header>

    <div class="setting-item">
        <div class="setting-item__meta">
            <h4>{{ 'SETTINGS.IMPORT_EXPORT_DATA' | translate }}</h4>
            <p>
                {{ 'SETTINGS.IMPORT_EXPORT_DATA_DESCRIPTION' | translate }}
            </p>
        </div>
        <div class="setting-item__control inline-actions">
            <button
                mat-button
                type="button"
                class="inline-actions__button"
                [class.inline-actions__button--busy]="isImportingData()"
                [disabled]="
                    isRemovingAllPlaylists() ||
                    isExportingData() ||
                    isImportingData()
                "
                [attr.aria-busy]="isImportingData()"
                (click)="importData.emit()"
            >
                @if (isImportingData()) {
                    <mat-progress-spinner
                        class="button-spinner"
                        diameter="16"
                        mode="indeterminate"
                    />
                }
                <span class="inline-actions__label">{{
                    'SETTINGS.IMPORT_DATA' | translate
                }}</span>
            </button>
            <button
                mat-button
                type="button"
                class="inline-actions__button"
                [class.inline-actions__button--busy]="isExportingData()"
                [disabled]="isRemovingAllPlaylists() || isExportingData()"
                [attr.aria-busy]="isExportingData()"
                (click)="exportData.emit()"
            >
                @if (isExportingData()) {
                    <mat-progress-spinner
                        class="button-spinner"
                        diameter="16"
                        mode="indeterminate"
                    />
                    <span class="inline-actions__label">{{
                        'SETTINGS.EXPORTING_DATA' | translate
                    }}</span>
                } @else {
                    <span class="inline-actions__label">{{
                        'SETTINGS.EXPORT_DATA' | translate
                    }}</span>
                }
            </button>
        </div>
    </div>

    @if (isPwa()) {
        <div class="settings-note">
            {{ 'SETTINGS.EPG_NOTE' | translate }}
            &nbsp;<a
                href="https://github.com/Snapwave333/carbon_cast/releases"
                target="_blank"
                rel="noreferrer"
                >{{ 'SETTINGS.EPG_NOTE_URL_TEXT' | translate }}</a
            >
        </div>
    }
</section>
